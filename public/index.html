<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Core -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <meta
      name="theme-color"
      content="#fffaf8"
    />

    <title>I Love You So Much</title>

    <meta
      name="description"
      content="A simple place to express how deeply you love someone and share a heartfelt message."
    />

    <!-- Site Identity -->
    <link
      rel="icon"
      type="image/png"
      href="%PUBLIC_URL%/heart.png"
    />

    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/heart.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="I Love You So Much"
    />

    <meta
      property="og:description"
      content="A place to share the overwhelming, beautiful feeling of loving someone with your whole heart."
    />

    <!-- Add these once you have the final production domain -->
    <!--
    <meta
      property="og:url"
      content="https://your-domain.com/"
    />

    <meta
      property="og:image"
      content="https://your-domain.com/og-image.png"
    />
    -->

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="I Love You So Much"
    />

    <meta
      name="twitter:description"
      content="A place to share the overwhelming, beautiful feeling of loving someone with your whole heart."
    />

    <!-- Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-FY9NWBCPFR"
    ></script>

    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        window.dataLayer.push(arguments);
      }

      gtag('js', new Date());
      gtag('config', 'G-FY9NWBCPFR');
    </script>
  </head>

  <body>
    <noscript>
      JavaScript is required to use this site.
    </noscript>

    <div id="root"></div>
  </body>
</html>
